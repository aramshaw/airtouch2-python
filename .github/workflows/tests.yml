# Runs the unit test suite on every push and pull request.
# Back-ported from mattjamesaus/airtouch2-python (add-at2plus-aux-sensor-status).
name: Tests

on:
  push:
    branches:
      - master
      - "feat/**"
      - "fix/**"
  pull_request:

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: python -m pip install .

      - name: Run unit tests
        # Pattern "*test*.py" (not the default "test*.py") so crc_test.py is included.
        run: python -m unittest discover -s tests -p "*test*.py" -v
